<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M1 | Terminal Tático</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #050505; color: #FFFFFF; font-family: 'Courier New', Courier, monospace; 
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        #m1-dynamic-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-size: cover; background-position: center; opacity: 0.15; z-index: -2; }
        #m1-bg-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(180deg, rgba(5,5,5,0.7) 0%, rgba(5,5,5,0.98) 100%); z-index: -1; }
        
        /* Novos Botões Divididos */
        .tactical-btn-half { 
            width: 40vw; height: 35vh; border-radius: 30px; border: 3px solid; 
            background: rgba(10, 10, 10, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: all 0.2s ease; box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .tactical-btn-half.recording-text { background: rgba(217, 17, 31, 0.85); transform: scale(0.95); box-shadow: 0 0 50px rgba(217,17,31,0.6); }
        .tactical-btn-half.recording-audio { background: rgba(249, 115, 22, 0.85); transform: scale(0.95); box-shadow: 0 0 50px rgba(249,115,22,0.6); }
        
        .pulse-icon { animation: pulse-anim 1s infinite alternate; color: #FFF !important; }
        @keyframes pulse-anim { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.2); opacity: 0.8; } }
        .status-log { font-family: monospace; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen w-screen py-8 overflow-hidden relative">
    <div id="m1-dynamic-bg"></div>
    <div id="m1-bg-overlay"></div>

    <!-- Header -->
    <div class="w-full px-8 mt-2 flex justify-between items-center opacity-70">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-red-600 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-bold tracking-widest text-red-500">CONECTANDO...</span>
        </div>
        <i class="fa-solid fa-signal text-gray-600 text-sm"></i>
    </div>

    <!-- Título -->
    <div class="text-center flex flex-col items-center justify-center mb-2">
        <h1 class="text-3xl font-black tracking-widest text-white opacity-90">DIRETORA</h1>
        <p class="text-[9px] text-gray-500 tracking-[0.4em] mt-3 font-bold uppercase">Painel Tático Duplo</p>
    </div>

    <!-- Painel de Controle Principal -->
    <div id="mainControlPanel" class="w-full flex justify-center gap-4 px-6 mt-4">
        <button id="btnText" class="tactical-btn-half border-red-600/70 focus:outline-none touch-manipulation">
            <i id="iconText" class="fa-solid fa-brain text-4xl text-red-500 mb-4 transition-colors"></i>
            <span id="labelText" class="text-[10px] font-bold tracking-widest text-gray-400 uppercase text-center px-2">IA / Texto</span>
        </button>
        
        <button id="btnRadio" class="tactical-btn-half border-orange-500/70 focus:outline-none touch-manipulation">
            <i id="iconRadio" class="fa-solid fa-walkie-talkie text-4xl text-orange-500 mb-4 transition-colors"></i>
            <span id="labelRadio" class="text-[10px] font-bold tracking-widest text-gray-400 uppercase text-center px-2">Rádio Puro</span>
        </button>
    </div>

    <!-- Módulo Player Volátil (Invisível por padrão) -->
    <div id="playerVolatil" class="hidden w-[85vw] bg-[#101010]/90 border border-[#2C1013] rounded-3xl p-6 flex flex-col items-center justify-center backdrop-blur-md shadow-[0_0_40px_rgba(217,17,31,0.15)] mt-4 absolute top-[30%] z-50">
        <div class="flex items-center gap-2 mb-6">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-bold tracking-widest text-green-500">MENSAGEM RECEBIDA</span>
        </div>
        <div class="flex gap-4 w-full justify-center">
            <button onclick="MusicPilot.tocarAudioVolatil()" class="flex-1 bg-[#1B1B1B] border border-gray-600 hover:border-white text-white font-bold py-4 rounded-xl text-xs transition shadow-md uppercase tracking-wider flex flex-col items-center gap-2">
                <i class="fa-solid fa-rotate-right text-lg"></i> Replay
            </button>
            <button onclick="MusicPilot.destruirAudioVolatil()" class="flex-2 bg-red-600 hover:bg-red-500 text-white font-bold px-6 py-4 rounded-xl text-xs transition shadow-[0_0_15px_rgba(220,38,38,0.5)] uppercase tracking-wider flex flex-col items-center gap-2">
                <i class="fa-solid fa-check text-lg"></i> Entendido
            </button>
        </div>
    </div>

    <!-- Console de Debug -->
    <div class="w-full px-8 mb-4">
        <div id="debugConsole" class="w-full bg-[#0a0a0a] border border-[#1a1a1a] rounded-xl h-20 p-3 overflow-y-auto text-[9px] text-gray-500 status-log">
            [SYS] Sistema Multi-Agente Armado.
        </div>
    </div>

    <script src="music_pilot.js"></script>
</body>
</html>
