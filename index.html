<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A DIRETORA - Terminal M1</title>
    
    <!-- Configurações PWA -->
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Dependências (Tailwind para layout rápido, FontAwesome para ícones táticos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --m1-red: #D9111F;
            --m1-red-glow: rgba(217, 17, 31, 0.6);
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: #FFFFFF;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* Mantém a matriz estática no telemóvel */
            height: 100dvh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Camada Base e Fundo Tático */
        #bg-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 80% 20%, rgba(217, 17, 31, 0.15) 0%, transparent 40%),
                        linear-gradient(180deg, rgba(5,5,5,0.8) 0%, var(--bg-dark) 100%);
            z-index: -1;
        }

        /* Estilização do Título Superior */
        .title-neon {
            font-family: 'Arial', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
            color: transparent;
            -webkit-text-stroke: 1px var(--m1-red);
            text-shadow: 0 0 15px var(--m1-red-glow);
            border-bottom: 2px solid var(--m1-red);
            box-shadow: 0 10px 10px -10px var(--m1-red);
            padding-bottom: 5px;
            display: inline-block;
        }

        /* Cápsulas de Comando (Botões) */
        .cmd-btn {
            background: linear-gradient(145deg, rgba(20, 5, 5, 0.9) 0%, rgba(5, 5, 5, 0.95) 100%);
            border: 1px solid rgba(217, 17, 31, 0.4);
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(217, 17, 31, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.8);
            transition: all 0.15s ease-out;
            position: relative;
            overflow: hidden;
        }

        /* Reflexo superior do vidro (Glassmorphism) */
        .cmd-btn::before {
            content: '';
            position: absolute; top: 0; left: 10%; width: 80%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,100,100,0.5), transparent);
            opacity: 0.5;
        }

        .cmd-btn:active {
            transform: scale(0.96);
            border-color: var(--m1-red);
            box-shadow: 0 0 25px var(--m1-red-glow), inset 0 0 30px rgba(217, 17, 31, 0.2);
        }

        .icon-wrapper {
            background: radial-gradient(circle, rgba(217, 17, 31, 0.2) 0%, transparent 70%);
            border: 1px solid var(--m1-red);
            box-shadow: 0 0 15px var(--m1-red-glow);
        }

        .arrow-wrapper {
            border: 1px solid var(--m1-red);
            box-shadow: 0 0 10px var(--m1-red-glow);
        }

        /* Terminal Inferior */
        #console-panel {
            background: rgba(5, 5, 5, 0.95);
            border: 1px solid rgba(217, 17, 31, 0.3);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
            position: relative;
        }
        
        #console-panel::after {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(217, 17, 31, 0.03) 2px, rgba(217, 17, 31, 0.03) 4px);
            pointer-events: none;
        }

        .text-neon-red { color: var(--m1-red); text-shadow: 0 0 8px var(--m1-red-glow); }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <!-- CABEÇALHO (Escudo elevado de pt-8 para pt-4) -->
    <header class="flex justify-center pt-4 z-10 relative">
        <div class="w-24 h-24 flex items-center justify-center">
            <i class="fa-solid fa-shield-halved text-6xl text-neon-red" style="color: #D9111F; filter: drop-shadow(0 0 15px rgba(217,17,31,0.6));"></i>
        </div>
    </header>

    <!-- BLOCO INFERIOR UNIFICADO: Sobe em direção ao escudo (-translate-y-6) -->
    <div class="flex-1 flex flex-col w-full z-10 relative -translate-y-6">
        
        <!-- NOME DA DIRETORA (mt-2 para descer exatamente Meia Linha) -->
        <div class="text-center z-20 mt-2">
            <h1 class="text-2xl title-neon">A DIRETORA</h1>
        </div>

        <!-- NÚCLEO DE OPERAÇÕES (Botões) (Ajustado para mt-4 para manter o alinhamento com a descida do título) -->
        <main class="flex-1 flex flex-col justify-center px-6 gap-4 w-full max-w-md mx-auto mt-4">
            
            <!-- 1. ENVIAR ÁUDIO -->
            <button class="cmd-btn w-full p-4 flex items-center justify-between group" onclick="executarAcao('audio')">
                <div class="flex items-center gap-4">
                    <div class="icon-wrapper w-14 h-14 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-microphone text-2xl text-neon-red group-hover:scale-110 transition-transform"></i>
                    </div>
                    <div class="text-left">
                        <p class="text-[10px] text-gray-400 tracking-widest uppercase mb-1">Enviar</p>
                        <h2 class="text-2xl font-bold text-white tracking-wide font-sans">ÁUDIO</h2>
                        <p class="text-[9px] text-gray-500 mt-1">Fale, grave ou envie seu áudio.</p>
                    </div>
                </div>
                <div class="arrow-wrapper w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-chevron-right text-neon-red text-sm"></i>
                </div>
            </button>

            <!-- 2. ENVIAR TEXTO -->
            <button class="cmd-btn w-full p-4 flex items-center justify-between group" onclick="executarAcao('texto')">
                <div class="flex items-center gap-4">
                    <div class="icon-wrapper w-14 h-14 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-comment-sms text-2xl text-neon-red group-hover:scale-110 transition-transform"></i>
                    </div>
                    <div class="text-left">
                        <p class="text-[10px] text-gray-400 tracking-widest uppercase mb-1">Enviar</p>
                        <h2 class="text-2xl font-bold text-white tracking-wide font-sans">TEXTO</h2>
                        <p class="text-[9px] text-gray-500 mt-1">Digite sua mensagem.</p>
                    </div>
                </div>
                <div class="arrow-wrapper w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-chevron-right text-neon-red text-sm"></i>
                </div>
            </button>

            <!-- 3. RECEBER MENSAGENS -->
            <button class="cmd-btn w-full p-4 flex items-center justify-between group" onclick="executarAcao('mensagens')">
                <div class="flex items-center gap-4">
                    <div class="icon-wrapper w-14 h-14 rounded-full flex items-center justify-center">
                        <i class="fa-regular fa-envelope text-2xl text-neon-red group-hover:scale-110 transition-transform"></i>
                    </div>
                    <div class="text-left">
                        <p class="text-[10px] text-gray-400 tracking-widest uppercase mb-1">Receber</p>
                        <h2 class="text-2xl font-bold text-white tracking-wide font-sans">MENS</h2>
                        <p class="text-[9px] text-gray-500 mt-1">Confira suas mensagens.</p>
                    </div>
                </div>
                <div class="arrow-wrapper w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-chevron-right text-neon-red text-sm"></i>
                </div>
            </button>

        </main>

        <!-- RODAPÉ E TERMINAL -->
        <footer class="w-full px-6 pb-6 pt-4 max-w-md mx-auto">
            <div id="console-panel" class="w-full h-16 p-3 rounded-lg flex items-center">
                <div class="text-[9px] text-neon-red tracking-widest leading-relaxed">
                    <span class="opacity-70">> [SYS] TERMINAL INICIALIZADO.</span><br>
                    <span class="opacity-70">> AGUARDANDO COMANDO...</span>
                    <span class="animate-pulse font-bold text-lg leading-none align-middle ml-1">_</span>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-[10px] text-gray-500">Powered by <span class="font-bold text-white text-xs">Medius.IA&copy;</span></p>
            </div>
        </footer>
    </div>

    <!-- LÓGICA DE INTERAÇÃO -->
    <script>
        function executarAcao(tipo) {
            const terminalLines = document.querySelector('#console-panel div');
            
            terminalLines.innerHTML = terminalLines.innerHTML.replace('<span class="animate-pulse font-bold text-lg leading-none align-middle ml-1">_</span>', '');
            
            let logMsg = "";
            switch(tipo) {
                case 'audio': logMsg = "> ACIONANDO MICROFONE TÁTICO..."; break;
                case 'texto': logMsg = "> ABRINDO CONSOLE DE INSERÇÃO..."; break;
                case 'mensagens': logMsg = "> SINCRONIZANDO PACOTES DE REDE..."; break;
            }

            terminalLines.innerHTML = `
                <span class="opacity-70">> [SYS] REQUISIÇÃO RECEBIDA.</span><br>
                <span class="opacity-90 font-bold">${logMsg}</span>
                <span class="animate-pulse font-bold text-lg leading-none align-middle ml-1">_</span>
            `;

            setTimeout(() => {
                terminalLines.innerHTML = `
                    <span class="opacity-70">> [SYS] TERMINAL PRONTO.</span><br>
                    <span class="opacity-70">> AGUARDANDO COMANDO...</span>
                    <span class="animate-pulse font-bold text-lg leading-none align-middle ml-1">_</span>
                `;
            }, 2500);
        }
    </script>
</body>
</html>
